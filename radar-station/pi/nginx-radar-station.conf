# SUKI Radar Station: statische App + Reverse-Proxy auf SignalK (:3000) und mayara (:6502)
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
    listen 8090;
    listen [::]:8090;
    root /home/admin/radar-station/www;
    # App-JavaScript/CSS und JSON komprimieren (Standard-nginx komprimiert nur HTML)
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml application/manifest+json;
    gzip_proxied any;
    gzip_min_length 1024;
    index index.html;
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    location = /version.txt { add_header Cache-Control "no-store"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /signalk/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }
    location /mayara/ {
        proxy_pass http://127.0.0.1:6502/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }
    # Karten-/Satellitenkacheln, Revier-Download, Kielspur, Coral Atlas → chart-proxy
    location /tiles/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 300m;
    }
    # nur für Entwicklung/Tests: mayara-Emulator (manuell gestartet auf :6503)
    location /mayara-emu/ {
        proxy_pass http://127.0.0.1:6503/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }
}
