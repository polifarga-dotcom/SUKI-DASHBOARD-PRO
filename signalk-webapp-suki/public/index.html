<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUKI Dashboard Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1a;
      color: #e0e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 32px 28px;
      text-align: center;
    }
    .anchor { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #7a9ab5; margin-bottom: 20px; line-height: 1.5; }
    .note {
      font-size: 12px; color: #5a7a95;
      background: rgba(0,200,255,0.06);
      border: 1px solid rgba(0,200,255,0.15);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      line-height: 1.6;
      text-align: left;
    }
    .note strong { color: #00c8ff; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(0,200,255,0.2);
      border-top-color: #00c8ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-text { font-size: 12px; color: #5a7a95; }
    a { color: #00c8ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="anchor">⚓</div>
    <h1>SUKI Dashboard Pro</h1>
    <p class="sub">Neel 47 Trimaran — Anchor Alarm &amp; Boat Monitor</p>

    <div class="note">
      <strong>Requirements:</strong><br>
      • <strong>signalk-plugin-suki-bridge</strong> installed &amp; configured<br>
      • Active NMEA data connection via SignalK<br>
      • SUKI PRO account at <a href="https://suki-dashboard-pro.pages.dev" target="_blank">suki-dashboard-pro.pages.dev</a>
    </div>

    <div class="spinner"></div>
    <p class="redirect-text">Opening app…</p>
  </div>

  <script>
    // Redirect after brief info display
    setTimeout(function() {
      window.location.replace('https://suki-dashboard-pro.pages.dev');
    }, 2500);
  </script>
</body>
</html>
